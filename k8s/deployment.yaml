apiVersion: apps/v1
kind: Deployment
metadata:
  name: walmart-ml-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: walmart-ml
  template:
    metadata:
      labels:
        app: walmart-ml
    spec:
      containers:
        - name: walmart-ml-api
          image: walmart-ml-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
