
apiVersion: apps/v1
kind: Deployment
metadata:
  name: walmart-ml-api
  labels:
    app: walmart-ml-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: walmart-ml-api
  template:
    metadata:
      labels:
        app: walmart-ml-api
    spec:
      containers:
        - name: walmart-ml-api
          image: walmart-ml-api:lab11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
