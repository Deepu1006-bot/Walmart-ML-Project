name: Walmart Lab 9 - Failure Handling

on:
  push:
    branches: [master, main]
    paths:
      - "src/mlops_pipeline/**"
      - "tests/**"
      - ".github/workflows/lab9_failure_tests.yml"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  failure-handling-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib pytest

      - name: Validate source dataset
        run: python src/mlops_pipeline/01_load_data.py

      - name: Run data validation
        run: python src/mlops_pipeline/02_validate_data.py

      - name: Run failure-handling and pipeline tests
        run: python -m pytest tests -v
