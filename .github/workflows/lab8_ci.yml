
name: Walmart Lab 8 - CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate Walmart dataset
        run: python src/mlops_pipeline/01_load_data.py

      - name: Validate dataset quality
        run: python src/mlops_pipeline/02_validate_data.py

      - name: Preprocess Walmart dataset
        run: python src/mlops_pipeline/03_preprocess_data.py

      - name: Validate preprocessed outputs
        run: python src/mlops_pipeline/04_validate_outputs.py

      - name: Train Random Forest model
        run: python src/mlops_pipeline/05_train_registry.py

      - name: Evaluate model
        run: python src/mlops_pipeline/06_model_evaluation.py

      - name: Run model quality gate
        run: python src/mlops_pipeline/07_quality_gate.py

      - name: Run inference
        run: python src/mlops_pipeline/09_inference.py

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Upload Lab 7 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walmart-lab7-artifacts
          path: |
            artifacts/lab7/
            data/processed/lab7_metadata.json
          if-no-files-found: warn
          retention-days: 7
