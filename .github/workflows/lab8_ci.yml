
name: Walmart Lab 9 - Failure Handling

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  failure-handling-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate Walmart dataset
        run: python src/mlops_pipeline/01_load_data.py

      - name: Run failure-handling tests
        run: python -m pytest tests/test_failure_handling.py tests/test_data_validation.py -v

      - name: Run failure injection checks
        run: python src/mlops_pipeline/10_failure_injection.py

      - name: Upload failure-handling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walmart-lab9-failure-reports
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 7
