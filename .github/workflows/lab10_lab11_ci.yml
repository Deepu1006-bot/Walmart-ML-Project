
name: Walmart Lab 10-11 - API and Docker CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  api-tests:
    name: Lab 10 - FastAPI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Verify model artifacts
        run: |
          test -f artifacts/lab7/walmart_random_forest.joblib
          test -f data/processed/lab7_metadata.json

      - name: Run API and project tests
        run: python -m pytest tests/ -v

      - name: Upload test report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab10-lab11-test-results
          path: |
            artifacts/lab11/container_validation_report.json
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Lab 11 - Docker Image Build
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: walmart-ml-api:ci
          push: false
