
name: Walmart Lab 10-11 - API and Docker CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lab10-api:
    name: Lab 10 - FastAPI and Project Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install pytest httpx2

      - name: Generate model artifacts
        run: |
          python src/mlops_pipeline/01_load_data.py
          python src/mlops_pipeline/02_validate_data.py
          python src/mlops_pipeline/03_preprocess_data.py
          python src/mlops_pipeline/04_validate_outputs.py
          python src/mlops_pipeline/05_train_registry.py
          python src/mlops_pipeline/06_model_evaluation.py
          python src/mlops_pipeline/07_quality_gate.py

      - name: Run inference
        run: python src/mlops_pipeline/09_inference.py

      - name: Verify model artifacts
        run: |
          test -f artifacts/lab7/walmart_random_forest.joblib
          test -f data/processed/lab7_metadata.json

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Upload Lab 10 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walmart-lab10-artifacts
          path: |
            artifacts/lab7/
            artifacts/lab10/
            data/processed/lab7_metadata.json
          if-no-files-found: warn
          retention-days: 7

  lab11-docker:
    name: Lab 11 - Docker Image Build
    runs-on: ubuntu-latest
    needs: lab10-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install pytest httpx2

      - name: Generate model artifacts
        run: |
          python src/mlops_pipeline/01_load_data.py
          python src/mlops_pipeline/02_validate_data.py
          python src/mlops_pipeline/03_preprocess_data.py
          python src/mlops_pipeline/04_validate_outputs.py
          python src/mlops_pipeline/05_train_registry.py
          python src/mlops_pipeline/06_model_evaluation.py
          python src/mlops_pipeline/07_quality_gate.py
          python src/mlops_pipeline/09_inference.py

      - name: Verify Docker build inputs
        run: |
          test -f Dockerfile
          test -f requirements-api.txt
          test -f artifacts/lab7/walmart_random_forest.joblib
          test -f data/processed/lab7_metadata.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: walmart-ml-api:ci
          push: false
          load: false

      - name: Upload Lab 11 build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walmart-lab11-reports
          path: |
            docs/lab11_containerization_report.md
            docs/lab11_deployment_debugging_report.md
          if-no-files-found: warn
          retention-days: 7
